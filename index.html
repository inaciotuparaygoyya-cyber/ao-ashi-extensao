<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ao Ashi - Shuuto</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Aviso se nenhum token estiver selecionado -->
        <div id="no-selection" class="box">
            <h3>⚽ Nenhum Token Selecionado</h3>
            <p>Clica num token na mesa do Owlbear Rodeo e abre a extensão novamente.</p>
        </div>

        <!-- Escolha de Papel (Jogador vs Mestre) -->
        <div id="role-selection" class="box" style="display: none;">
            <h3>Papel do Atleta</h3>
            <p>Escolhe quem comanda este token:</p>
            <button id="btn-player" class="btn blue">Atleta - Jogador</button>
            <button id="btn-gm" class="btn red" style="display: none;">Atleta - Mestre (GM)</button>
        </div>

        <!-- Ficha Principal -->
        <div id="character-sheet" class="box" style="display: none;">
            <div class="header-row">
                <input type="text" id="athlete-name" placeholder="Nome do Atleta">
                <button id="btn-reset" class="btn gray" title="Trocar Papel">⚙️</button>
            </div>
            <div id="role-badge" class="badge">Jogador</div>

            <!-- Abordagens Fate Acelerado -->
            <h4>Abordagens (4DF)</h4>
            <div id="approach-list"></div>

            <!-- Aspectos, Técnicas e Falhas -->
            <h4>Aspectos</h4>
            <div id="container-aspects"></div>
            <button class="btn green add-btn" data-type="aspects">+ Adicionar Aspecto</button>

            <h4>Técnicas</h4>
            <div id="container-techniques"></div>
            <button class="btn green add-btn" data-type="techniques">+ Adicionar Técnica</button>

            <h4>Falhas</h4>
            <div id="container-flaws"></div>
            <button class="btn green add-btn" data-type="flaws">+ Adicionar Falha</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@latest/dist/omrid.browser.js"></script>
    <script src="/main.js"></script>
</body>
</html>
