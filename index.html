<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha do Atleta - Ao Ashi</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="sheet-container">
        <h2>Ficha do Atleta</h2>
        <div id="no-selection" class="warning">Seleciona um token na mesa para ver a ficha.</div>
        
        <div id="character-sheet" style="display: none;">
            <div class="field">
                <label>Nome:</label>
                <input type="text" id="char-name" placeholder="Nome do Jogador">
            </div>
            <div class="field">
                <label>Fôlego (Stamina):</label>
                <input type="number" id="char-stamina" value="100">
            </div>
            <div class="field">
                <label>Técnica / Visão:</label>
                <input type="number" id="char-technique" value="10">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@latest/dist/omrid.browser.js"></script>
    <script src="/main.js"></script>
</body>
</html>
