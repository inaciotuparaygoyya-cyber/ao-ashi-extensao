<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ao Ashi - Shuuto TTRPG</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Estado: Nenhum token selecionado -->
        <div id="no-selection" class="placeholder-card">
            <div class="icon">⚽</div>
            <h3>Ao Ashi - Shuuto</h3>
            <p>Seleciona um token na mesa para abrir a ficha do atleta.</p>
        </div>

        <!-- Estado 1: Seleção do Tipo de Ficha (Jogador vs Mestre) -->
        <div id="role-selection" class="sheet-card" style="display: none;">
            <h2>Tipo de Ficha</h2>
            <p>Escolhe o teu papel para este token:</p>
            <button class="role-btn player" id="btn-player">Atleta - Jogador</button>
            <button class="role-btn gm" id="btn-gm" style="display: none;">Atleta - Mestre (GM)</button>
        </div>

        <!-- Estado 2: Ficha Ativa do Atleta -->
        <div id="character-sheet" class="sheet-card" style="display: none;">
            <header class="sheet-header">
                <div class="header-top">
                    <input type="text" id="athlete-name" class="name-input" placeholder="Nome do Atleta">
                    <button id="btn-back-role" class="back-btn" title="Mudar Papel">⚙️</button>
                </div>
                <div class="role-badge" id="active-role-badge">Jogador</div>
            </header>

            <!-- Abordagens Fate Acelerado (4DF) -->
            <section class="approaches-section">
                <h3>Abordagens</h3>
                <div class="approach-grid" id="approach-grid">
                    <!-- Gerado via JS para suportar rolagens 4DF -->
                </div>
            </section>

            <!-- Seções Dinâmicas: Aspectos, Técnicas, Falhas -->
            <div class="dynamic-sections">
                <!-- Aspectos -->
                <div class="box-section">
                    <div class="section-header">
                        <h3>Aspectos</h3>
                        <button class="add-item-btn" data-target="aspects">+ Adicionar</button>
                    </div>
                    <div id="container-aspects" class="item-list"></div>
                </div>

                <!-- Técnicas -->
                <div class="box-section">
                    <div class="section-header">
                        <h3>Técnicas</h3>
                        <button class="add-item-btn" data-target="techniques">+ Adicionar</button>
                    </div>
                    <div id="container-techniques" class="item-list"></div>
                </div>

                <!-- Falhas -->
                <div class="box-section">
                    <div class="section-header">
                        <h3>Falhas</h3>
                        <button class="add-item-btn" data-target="flaws">+ Adicionar</button>
                    </div>
                    <div id="container-flaws" class="item-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- SDK do Owlbear Rodeo -->
    <script src="https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@latest/dist/omrid.browser.js"></script>
    <script src="/main.js"></script>
</body>
</html>
